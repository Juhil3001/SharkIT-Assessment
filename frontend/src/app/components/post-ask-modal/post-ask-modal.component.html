<div class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal" role="dialog" aria-labelledby="post-ask-title">
    <div class="modal-header">
      <h3 id="post-ask-title">Post an Ask</h3>
      <button class="sk-iconbtn" type="button" (click)="close.emit()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="field-label" for="company">Company</label>
      <input class="input" id="company" formControlName="company" />

      <label class="field-label" for="founder">Your Name (Founder)</label>
      <input class="input" id="founder" formControlName="founder" />

      <label class="field-label" for="sector">Sector</label>
      <input class="input" id="sector" formControlName="sector" placeholder="e.g. Fintech, HealthTech" />

      <label class="field-label" for="pitch">One-line Pitch</label>
      <input class="input" id="pitch" formControlName="pitch" maxlength="120" />

      <label class="field-label" for="type">Funding Type</label>
      <select class="input" id="type" formControlName="type">
        <option value="equity">Equity</option>
        <option value="loan">Loan</option>
        <option value="grant">Grant</option>
      </select>

      <label class="field-label" for="amount">Amount Sought (₹)</label>
      <input class="input" id="amount" type="number" formControlName="amount" />

      <ng-container *ngIf="form.value.type === 'equity'">
        <label class="field-label" for="equity">Equity % Offered</label>
        <input class="input" id="equity" type="number" formControlName="equity_pct" min="0" max="100" />
      </ng-container>

      <div class="field-error" *ngIf="equityError">{{ equityError }}</div>
      <div class="field-error" *ngIf="serverError">{{ serverError }}</div>

      <button class="btn-primary btn-full" type="submit" [disabled]="form.invalid || submitting">
        {{ submitting ? 'Posting...' : 'Post Deal' }}
      </button>
    </form>
  </div>
</div>
